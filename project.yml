name: WanLaNit
options:
  bundleIdPrefix: app.wanlanit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
packages:
  ThaiLearn:
    path: .
targets:
  WanLaNit:
    type: application
    platform: macOS
    sources:
      - path: App
      # `resources:` is not an XcodeGen key, so it was ignored and the JSON
      # never reached Copy Bundle Resources. A group copies each file to
      # Contents/Resources/<name>.json (not a Content/ subdirectory).
      - path: Content
        buildPhase: resources
        type: group
    dependencies:
      - package: ThaiLearn
        product: ThaiLearnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wanlanit.WanLaNit
        PRODUCT_NAME: WanLaNit
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: วันละนิด
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "跟读打分和语音输入需要使用麦克风。这段录音只用于这一次识别。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "没有云端语音时，用系统的泰语识别给跟读打分。能在这台 Mac 上完成时不会把声音发出去。"
        # Sandbox stays off. If it is turned on later, also add
        # com.apple.security.network.client, com.apple.security.device.audio-input,
        # and com.apple.security.files.user-selected.read-only.
        ENABLE_APP_SANDBOX: NO
schemes:
  WanLaNit:
    build:
      targets:
        WanLaNit: all
    run:
      config: Debug
    archive:
      config: Release
