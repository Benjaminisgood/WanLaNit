name: WanLaNit
options:
  bundleIdPrefix: app.wanlanit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
packages:
  ThaiLearn:
    path: .
targets:
  WanLaNit:
    type: application
    platform: macOS
    sources:
      - path: App
      # `resources:` is not an XcodeGen key, so it was ignored and the JSON
      # never reached Copy Bundle Resources. A group copies each file to
      # Contents/Resources/<name>.json (not a Content/ subdirectory).
      - path: Content
        buildPhase: resources
        type: group
    dependencies:
      - package: ThaiLearn
        product: ThaiLearnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wanlanit.WanLaNit
        PRODUCT_NAME: WanLaNit
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: วันละนิด
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ENABLE_APP_SANDBOX: NO
schemes:
  WanLaNit:
    build:
      targets:
        WanLaNit: all
    run:
      config: Debug
    archive:
      config: Release
